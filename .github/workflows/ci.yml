# CI/CD Pipeline — Zavala Software Portfolio
# DISABLED by default. Uses workflow_dispatch (manual trigger only).
# Uncomment the push/pull_request triggers below to enable automatic CI.

name: CI

on:
  workflow_dispatch: # Manual trigger — always available

  # ──────────────────────────────────────────────────────
  # Uncomment to enable automatic CI
  # ──────────────────────────────────────────────────────
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

# ─── Security: minimal permissions ────────────────────
permissions:
  contents: read

# ─── Security: cancel in-progress runs for the same branch ───
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────
  # Job 1: Lint & Type-check
  # ──────────────────────────────────────────────────────
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        # Security: action pinned to full SHA (actions/checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        # Security: action pinned to full SHA (actions/setup-node v4.1.0)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        # Security: npm ci for deterministic, lockfile-only installs
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

  # ──────────────────────────────────────────────────────
  # Job 2: Test
  # ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --coverage --no-cache

      - name: Upload coverage artifact
        # Security: action pinned to full SHA (actions/upload-artifact v4.4.3)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────
  # Job 3: Build
  # ──────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Security: no secrets or env vars passed — the build works without them.
      # If you add a Vercel deploy step later, use repository secrets and
      # reference them via ${{ secrets.YOUR_SECRET_NAME }}.
      - name: Build
        run: npm run build
